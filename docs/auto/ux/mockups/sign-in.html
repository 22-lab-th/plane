<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Plane SSO — Sign in mockup</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        --bg: #f7f7f8;
        --panel: #fff;
        --text: #171717;
        --muted: #737373;
        --line: #e5e5e5;
        --accent: #5b5bd6;
        --soft: #f1f1f4;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #111113;
          --panel: #18181b;
          --text: #fafafa;
          --muted: #a3a3a3;
          --line: #303033;
          --soft: #232326;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--text);
      }
      main {
        width: min(92vw, 420px);
        padding: 36px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--panel);
        box-shadow: 0 20px 60px #00000012;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 30px;
        font-weight: 700;
      }
      .mark {
        width: 26px;
        height: 26px;
        border-radius: 7px;
        background: var(--accent);
        display: grid;
        place-items: center;
        color: white;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 24px;
      }
      p {
        margin: 0 0 24px;
        color: var(--muted);
        line-height: 1.5;
      }
      button,
      input {
        width: 100%;
        height: 44px;
        border-radius: 7px;
        font: inherit;
      }
      button {
        border: 1px solid var(--line);
        background: var(--panel);
        color: var(--text);
        font-weight: 600;
        cursor: pointer;
      }
      button:hover {
        background: var(--soft);
      }
      button:focus-visible,
      input:focus-visible {
        outline: 3px solid color-mix(in srgb, var(--accent) 35%, transparent);
        outline-offset: 2px;
      }
      .sso {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        border-color: var(--accent);
      }
      .idp {
        width: 20px;
        height: 20px;
        border-radius: 4px;
        background: var(--accent);
        color: white;
        display: grid;
        place-items: center;
        font-size: 11px;
      }
      .divider {
        display: flex;
        align-items: center;
        gap: 12px;
        margin: 22px 0;
        color: var(--muted);
        font-size: 12px;
      }
      .divider::before,
      .divider::after {
        content: "";
        height: 1px;
        flex: 1;
        background: var(--line);
      }
      label {
        display: block;
        font-size: 13px;
        font-weight: 600;
        margin-bottom: 7px;
      }
      input {
        border: 1px solid var(--line);
        background: var(--panel);
        color: var(--text);
        padding: 0 12px;
        margin-bottom: 12px;
      }
      .primary {
        background: var(--text);
        color: var(--panel);
        border-color: var(--text);
      }
      .help {
        margin-top: 20px;
        text-align: center;
        color: var(--muted);
        font-size: 12px;
      }
      .enforced {
        padding: 12px;
        border-radius: 7px;
        background: var(--soft);
        color: var(--muted);
        font-size: 12px;
        margin-top: 18px;
      }
    </style>
  </head>
  <body>
    <main aria-labelledby="title">
      <div class="brand"><span class="mark">P</span> Plane</div>
      <h1 id="title">Sign in to Acme Plane</h1>
      <p>Use your organization account to continue.</p>
      <button class="sso" type="button"><span class="idp">A</span> Continue with Acme SSO</button>
      <div class="divider">or</div>
      <form>
        <label for="email">Work email</label>
        <input id="email" type="email" autocomplete="email" placeholder="name@company.com" />
        <button class="primary" type="submit">Continue with email</button>
      </form>
      <div class="enforced" role="note">
        When SSO enforcement is enabled, email and social sign-in controls are hidden and this screen sends users
        directly to the configured identity provider.
      </div>
      <div class="help">Having trouble signing in? Contact your instance administrator.</div>
    </main>
  </body>
</html>
