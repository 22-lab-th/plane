name: 22lab release images

on:
  workflow_dispatch:
  push:
    branches: [feat/project-file-storage]

permissions:
  contents: read

concurrency:
  group: 22lab-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.repository == '22-lab-th/plane'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: backend
            context: apps/api
            file: apps/api/Dockerfile.api
          - app: web
            context: .
            file: apps/web/Dockerfile.web
          - app: admin
            context: .
            file: apps/admin/Dockerfile.admin
          - app: live
            context: .
            file: apps/live/Dockerfile.live
          - app: space
            context: .
            file: apps/space/Dockerfile.space
          - app: proxy
            context: apps/proxy
            file: apps/proxy/Dockerfile.ce
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64
          tags: plane22lab/${{ matrix.app }}:git-${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/22-lab-th/plane
          # Downloadable images avoid depending on upstream Docker Hub secrets.
          # No production configuration or deployment credentials enter CI.
          outputs: type=docker,dest=/tmp/image.tar
      - name: Record and compress the image
        env:
          IMAGE: plane22lab/${{ matrix.app }}:git-${{ github.sha }}
          APP: ${{ matrix.app }}
        run: |
          set -euo pipefail
          docker load -i /tmp/image.tar
          mkdir -p release
          docker image inspect "$IMAGE" > "release/$APP-image.json"
          gzip -1 /tmp/image.tar
          mv /tmp/image.tar.gz "release/$APP.tar.gz"
          cd release
          sha256sum "$APP.tar.gz" > "$APP.sha256"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: plane-${{ matrix.app }}-${{ github.sha }}
          path: release/
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
